[project]
name = "indiafacts"
version = "0.1.0"
license = "Apache-2.0"
authors = [{ name = "Sarah Dhadda" }]
description = "Typed, source-linked facts for Indian equities. Research/education only; not financial advice."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pandas>=2.2", "yfinance>=0.2.40", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["indiafacts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the network; excluded by default"]
addopts = "-m 'not live' -q"
