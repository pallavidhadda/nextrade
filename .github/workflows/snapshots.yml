name: snapshots
# Precomputes analyses for the Nifty 50, the web app's example tickers and the top 500 by traded value (TejHQ open data) once per weekday and publishes them to the
# orphan `snapshots` branch (never main). The API serves them instantly; live analysis stays as "Refresh now". Education only.
on:
  schedule:
    - cron: "30 12 * * 1-5"      # 18:00 IST, after the NSE close
  workflow_dispatch:
    inputs:
      probe:
        description: "Only fetch 1-2 tickers and report whether Yahoo works from GitHub's runners"
        type: boolean
        default: false
      tickers:
        description: "Optional comma-separated tickers (default: Nifty 50, examples and the TejHQ top 500)"
        type: string
        default: ""
      dry_run:
        description: "Drift issues: print the issue title and body instead of opening or updating a GitHub issue"
        type: boolean
        default: false
  pull_request:                  # probe only: checks Yahoo from GitHub's runners before the workflow reaches main
    paths:
      - ".github/workflows/snapshots.yml"
      - "indiafacts/snapshots.py"
permissions:
  contents: read
jobs:
  probe:
    if: ${{ github.event_name == 'pull_request' || inputs.probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - name: probe
        env:
          TICKERS: ${{ inputs.tickers }}
        run: uv run python -m indiafacts.snapshots --probe ${TICKERS:+--tickers "$TICKERS"}

  snapshots:
    if: ${{ github.event_name != 'pull_request' && !inputs.probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    concurrency: snapshots-branch
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - name: fetch the current snapshots branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads origin snapshots >/dev/null 2>&1; then
            git clone --depth 1 --branch snapshots "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" snapshots
          else
            mkdir snapshots
          fi
      - name: fetch official shareholding history (data branch, if it exists)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" databranch
          else
            mkdir databranch
          fi
      - name: precompute
        # stage 1 builds snapshots/pool_metrics.json for the whole universe (shared comparison data, published with marketlens.json);
        # stage 2 builds each report against it and against its Market Lens sector, so no report fetches pool members.
        env:
          INDIAFACTS_SHP_REPO: ${{ github.workspace }}/databranch/shareholding.csv
          INDIAFACTS_POOL_SIZE: "30"
          TICKERS: ${{ inputs.tickers }}
        run: uv run python -m indiafacts.snapshots --out snapshots --universe tej500 ${TICKERS:+--tickers "$TICKERS"}
      - name: drift summary
        # drift_report.json is written by the precompute step (python -m indiafacts.snapshots); a warning shows here, a breaking
        # change also opens an issue in the drift-issue job and keeps yesterday's marketlens.json / pool_metrics.json.
        if: ${{ always() && hashFiles('snapshots/drift_report.json') != '' }}
        run: uv run python -m indiafacts.drift summary snapshots/drift_report.json >> "$GITHUB_STEP_SUMMARY"
      - name: keep the drift report for the issue job
        if: ${{ always() && hashFiles('snapshots/drift_report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: snapshots/drift_report.json
      - name: publish to the snapshots branch
        if: ${{ always() && hashFiles('snapshots/index.json') != '' }}
        working-directory: snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [ -d .git ] || { git init -q -b snapshots; git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"; }
          git config user.name "nextrade-snapshots"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "snapshots: $(date -u +%F)"
          git push origin snapshots

  drift-issue:
    # Opens or updates one issue per breaking source, titled "Source drift: <source>" (deduplicated by title). issues: write lives here only.
    needs: snapshots
    if: ${{ always() && github.event_name != 'pull_request' && !inputs.probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: drift-report
          path: drift
      - name: open or update drift issues
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f drift/drift_report.json ] || { echo "no drift report"; exit 0; }
          python3 -m indiafacts.drift issues drift/drift_report.json --run-url "$RUN_URL" $([ "$DRY_RUN" = "true" ] && echo --dry-run)
