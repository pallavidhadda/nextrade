name: shareholding
# The exchange's shareholding feed lists only the newest filings, so poll it often during results season and keep every
# snapshot in data/shareholding.csv. Over time this builds quarter-on-quarter history for free. Education only.
on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run python -m indiafacts.shareholding poll
      - name: commit new snapshots
        run: |
          git config user.name "nextrade-shareholding"
          git config user.email "actions@users.noreply.github.com"
          git add data/shareholding.csv
          git diff --cached --quiet || git commit -m "data: shareholding snapshots $(date -u +%FT%H)"
          git pull --rebase -q || true
          git push
